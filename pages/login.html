<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CAIS Portal Akademik</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="login-body">
    <div class="login-wrapper">
        <div class="login-header">
            <div class="logo-placeholder">🎓</div>
            <h2>CAIS Portal</h2>
            <p>Collaborative Academic Information System</p>
        </div>
        <form action="../index.html" class="login-form">
            <div class="input-group">
                <label for="username">NIM / NIDN</label>
                <input type="text" id="username" placeholder="Masukkan NIM atau NIDN" required>
            </div>
            <div class="input-group">
                <label for="password">Kata Sandi</label>
                <input type="password" id="password" placeholder="Masukkan kata sandi" required>
            </div>
            <div class="form-options">
                <label><input type="checkbox"> Ingat saya</label>
                <a href="#" class="forgot-password">Lupa sandi?</a>
            </div>
            <button type="submit" class="btn-login">Masuk ke Sistem</button>
        </form>
        <div class="login-footer">
            <p>&copy; 2026 Academic Information Center.</p>
        </div>
    </div>
</body>
</html>
